name: Notify Garmin sleep

on:
  workflow_dispatch:
    inputs:
      date:
        description: "睡眠日期 YYYY-MM-DD；留空则用 Asia/Shanghai 的今天"
        required: false
        default: ""
      dry_run:
        description: "只打印消息，不发送到 Telegram，也不记录已发送"
        type: boolean
        default: false
      force:
        description: "即使该日期已经发过，也再发一次。数据不完整时仍然跳过"
        type: boolean
        default: false
      debug:
        description: "打印 dailySleepDTO 相关字段和数值（去掉个人标识）。只在手动运行时生效"
        type: boolean
        default: false
  schedule:
    # 07:00–14:00 Asia/Shanghai, every hour. CST is UTC+8 all year.
    # 07:00 CST is 23:00 UTC; 08:00–14:00 CST is 00:00–06:00 UTC.
    - cron: "0 23 * * *"
    - cron: "0 0-6 * * *"

permissions:
  contents: write

concurrency:
  group: telegram-sleep
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
      GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
      GARMIN_IS_CN: ${{ vars.GARMIN_IS_CN || 'true' }}
      TELEGRAM_MEMOS_BOT_TOKEN: ${{ secrets.TELEGRAM_MEMOS_BOT_TOKEN }}
      TELEGRAM_MEMOS_CHAT_ID: ${{ secrets.TELEGRAM_MEMOS_CHAT_ID || vars.TELEGRAM_MEMOS_CHAT_ID }}
      SLEEP_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.date || '' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
      FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
      DEBUG_SLEEP: ${{ github.event_name == 'workflow_dispatch' && inputs.debug == true }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "garminconnect==0.3.6"
      - name: Test sleep notification
        run: python -m unittest tests/test_notify_garmin_sleep.py tests/test_telegram_memos.py
      - name: Send sleep summary
        id: notify
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set +e
          args=(python scripts/notify-garmin-sleep.py --state data/telegram/sleep-sent.json)
          if [ -n "$SLEEP_DATE" ]; then
            args+=(--date "$SLEEP_DATE")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ "$FORCE" = "true" ]; then
            args+=(--force)
          fi
          if [ "$DEBUG_SLEEP" = "true" ]; then
            args+=(--debug)
          fi
          "${args[@]}"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Commit sleep notification state
        if: always() && steps.notify.outputs.exit_code != ''
        run: |
          if [ -z "$(git status --porcelain -- data/telegram/sleep-sent.json)" ]; then
            echo "Sleep state unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/telegram/sleep-sent.json
            git commit -m "update sleep notification state"
            git push
          fi
          exit "${{ steps.notify.outputs.exit_code }}"
