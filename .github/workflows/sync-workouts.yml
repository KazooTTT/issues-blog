name: Sync Garmin workouts

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Number of days to fetch (use a larger value for backfills)"
        required: false
        default: "14"

permissions:
  contents: write
  issues: read

concurrency:
  group: garmin-workout-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    env:
      CONTENT_MODE: github
      GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
      GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
      GARMIN_IS_CN: ${{ vars.GARMIN_IS_CN || 'true' }}
      GARMIN_SYNC_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.days || '14' }}
      GITHUB_TOKEN: ${{ github.token }}
      SITE_URL: ${{ vars.SITE_URL || 'https://blog.kazoottt.top' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: python -m pip install "garminconnect==0.3.6"
      - run: pnpm install --frozen-lockfile
      - name: Test workout synchronization
        run: python -m unittest tests/test_fetch_garmin_workouts.py
      - name: Sync recent activities
        run: python scripts/fetch-garmin-workouts.py --days "$GARMIN_SYNC_DAYS" --merge --output src/data/workouts.json
      - run: pnpm test
      - run: pnpm build
      - id: changes
        name: Detect workout changes
        run: |
          if git diff --quiet -- src/data/workouts.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit synchronized workouts
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/workouts.json
          git commit -m "sync Garmin workouts"
          git push
      - name: Assemble Pages output
        if: steps.changes.outputs.changed == 'true'
        run: node scripts/build-pages.mjs
      - name: Deploy to Cloudflare Pages
        if: steps.changes.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/pages --project-name=issues-blog --branch=main
