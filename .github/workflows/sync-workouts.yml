name: Sync Garmin workouts

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *"

permissions:
  contents: write
  issues: read
  pages: write
  id-token: write

concurrency:
  group: garmin-workout-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    env:
      CONTENT_MODE: github
      GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
      GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
      GARMIN_IS_CN: ${{ vars.GARMIN_IS_CN || 'true' }}
      GITHUB_TOKEN: ${{ github.token }}
      SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: python -m pip install "garminconnect==0.3.6"
      - run: pnpm install --frozen-lockfile
      - name: Fetch recent activities
        run: python scripts/fetch-garmin-workouts.py --days 14 --output "${RUNNER_TEMP}/garmin-activities.json"
      - name: Merge workout snapshot
        run: pnpm sync:workouts -- --garmin --merge --input "${RUNNER_TEMP}/garmin-activities.json"
      - run: pnpm test
      - run: pnpm build
      - id: changes
        name: Detect workout changes
        run: |
          if git diff --quiet -- src/data/workouts.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit synchronized workouts
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/workouts.json
          git commit -m "sync Garmin workouts"
          git push
      - uses: actions/configure-pages@v6
        if: steps.changes.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.changes.outputs.changed == 'true'
        with:
          path: dist

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
