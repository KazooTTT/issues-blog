name: Build and deploy blog

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "CONTEXT.md"
      - "data/telegram/**"
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  issues: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_WISHLIST_API_URL: ${{ vars.PUBLIC_WISHLIST_API_URL }}
      PUBLIC_WISHLIST_PROJECT_URL: ${{ vars.PUBLIC_WISHLIST_PROJECT_URL }}
      CONTENT_MODE: github
      GITHUB_TOKEN: ${{ github.token }}
      SITE_URL: ${{ vars.SITE_URL || 'https://blog.kazoottt.top' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
      - name: Assemble Pages output
        run: node scripts/build-pages.mjs
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/pages --project-name=issues-blog --branch=main

